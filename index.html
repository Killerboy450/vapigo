<!DOCTYPE html>
<html>
<head>
<title>VapiGo Cab Booking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>VapiGo Cab Booking</h1>
<div class="booking">
<input type="text" id="name" placeholder="Your Name">
<input type="text" id="mobile" placeholder="Mobile Number">
<input type="text" id="pickup" placeholder="Pickup Location">
<input type="text" id="drop" placeholder="Drop Location">

<!-- Confirm booking button -->
<button onclick="confirmBooking()">Confirm Booking (WhatsApp)</button>

<!-- Show map button -->
<button onclick="showMap()">Show Route Map</button>

<p id="message"></p>

<!-- Map iframe -->
<iframe
id="mapFrame"
width="100%"
height="350"
style="border:0; margin-top:20px; display:none;"
loading="lazy">
</iframe>

<div id="fareBox" style="display:none; margin-top:15px;">
  <p><strong>Distance:</strong> <span id="distanceText"></span></p>
  <p><strong>Estimated Fare:</strong> ₹<span id="fareText"></span></p>
</div>

</div>
<script src="script.js"></script>
</body>
</html>
