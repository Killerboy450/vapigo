<!DOCTYPE html>
<html>
<head>
<title>VapiGo Cab Booking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1>VapiGo Cab Booking</h1>
<div class="booking">
<input type="text" id="name" placeholder="Your Name">
<input type="text" id="mobile" placeholder="Mobile Number">
<input type="text" id="pickup" placeholder="Pickup Location">
<input type="text" id="drop" placeholder="Drop Location">
<button onclick="bookRide()">Book Ride</button>
<p id="message"></p>
<iframe
id="mapFrame"
width="100%"
height="350"
style="border:0; margin-top:20px; display:none;"
loading="lazy">
</iframe>
</div>
<script src="script.js"></script>
</body>
</html>
